<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Dokumen Kualiti PTSS</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-circle">🏛️</div>
        <h1>Dashboard Dokumen Kualiti</h1>
        <p class="subtitle">Politeknik Tuanku Syed Sirajuddin</p>
      </div>

      <div id="login-error" class="alert alert-error hidden">
        ⚠️ ID atau Kata Laluan tidak sah. Cuba lagi.
      </div>
      <div id="login-locked" class="alert alert-error hidden">
        🔒 Akaun dikunci. Terlalu banyak cubaan gagal.
      </div>
      <button id="btn-unlock" class="btn btn-secondary btn-full hidden" style="margin-bottom:0.75rem;">
        🔓 Buka Kunci & Cuba Semula
      </button>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="userId">👤 ID Pengguna</label>
          <input type="text" id="userId" placeholder="Masukkan ID Pengguna" required />
        </div>
        <div class="form-group">
          <label for="password">🔑 Kata Laluan</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Masukkan Kata Laluan" required />
            <button type="button" id="togglePwd" class="toggle-pwd">👁️</button>
          </div>
        </div>
        <div id="attempts-info" class="attempts-info hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">Log Masuk</button>
      </form>

      <div class="divider">atau</div>

      <a href="public.html" class="btn btn-secondary btn-full">
        👁️ Paparan Awam (Tanpa Log Masuk)
      </a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
